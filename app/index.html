<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ДайМогнуть!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
 background: #fff; color: #141416; min-height: 100vh; overflow: hidden;
 --line: #e6e6e2; --dim: #8a8a90; --soft: #f4f4f2;
}
.screen { display: none; height: 100vh; overflow-y: auto; padding-bottom: 118px; }
.screen.active { display: flex; flex-direction: column; }
#mainContent, #statsContent, #settingsContent { flex: 1; display: flex; flex-direction: column; }

.nav {
 position: fixed; left: 50%; transform: translateX(-50%);
 bottom: calc(14px + env(safe-area-inset-bottom, 0px));
 display: flex; gap: 4px; padding: 6px;
 background: rgba(255,255,255,.9); backdrop-filter: blur(14px);
 border: 1px solid var(--line); border-radius: 999px;
 box-shadow: 0 6px 24px rgba(20,20,22,.1); z-index: 100;
}
.nav-btn {
 display: flex; flex-direction: column; align-items: center; gap: 3px;
 min-width: 78px; padding: 9px 12px; border: none; border-radius: 999px;
 background: none; color: var(--dim); font-family: inherit;
 font-size: 11px; font-weight: 600; cursor: pointer; transition: .15s;
}
.nav-btn.active { background: #141416; color: #fff; }
.nav-btn svg { width: 21px; height: 21px; }

/* заголовок по центру: кнопка «назад» выведена из потока,
   поэтому её наличие не сдвигает надпись */
.header {
 position: relative;
 display: flex; align-items: center; justify-content: center;
 padding: 18px 20px 10px; min-height: 58px;
}
.header-title { font-size: 21px; font-weight: 900; letter-spacing: -.03em; padding: 0 48px; text-align: center; }
.header-title .dim { color: var(--dim); }
.back-btn {
 position: absolute; left: 20px; top: 50%; margin-top: -20px;
 width: 40px; height: 40px; flex-shrink: 0; padding: 0;
 border-radius: 999px; border: 1px solid var(--line); background: #fff; color: #141416;
 display: flex; align-items: center; justify-content: center; cursor: pointer;
 box-shadow: 0 1px 4px rgba(20,20,22,.05); transition: border-color .15s, transform .15s;
}
.back-btn:hover { border-color: #141416; transform: translateX(-2px); }
.back-btn svg { width: 19px; height: 19px; }
body.in-tg .back-btn { display: none; }

.profile-card {
 margin: 12px 16px; background: #fff; border: 1px solid var(--line);
 border-radius: 22px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.04);
}
.profile-photo {
 width: 100%; aspect-ratio: 1/1; max-height: 44vh; background: var(--soft);
 display: flex; align-items: center; justify-content: center;
 color: var(--dim); font-size: 14px; position: relative; overflow: hidden;
 touch-action: pan-y;
}
.profile-photo img { width: 100%; height: 100%; object-fit: cover; }

.photo-dots { display: flex; gap: 5px; justify-content: center; padding: 10px; }
.photo-dot { width: 6px; height: 6px; border-radius: 999px; background: #d8d8d2; transition: .15s; }
.photo-dot.active { background: #141416; }
.profile-info { padding: 10px 18px 6px; }
.profile-info h2 { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 2px; }
.profile-info .username { font-size: 13.5px; color: var(--dim); margin-bottom: 8px; }
.profile-info .stats { display: flex; gap: 16px; font-size: 13px; color: var(--dim); margin-bottom: 8px; }
.profile-info .stats span { display: flex; align-items: center; gap: 4px; }
.profile-info .stats strong { color: #141416; font-weight: 700; }

.rate-section { padding: 0 16px 16px; }
.rate-title {
 font-size: 10.5px; color: var(--dim); margin-bottom: 10px; font-weight: 700;
 text-align: center; text-transform: uppercase; letter-spacing: .14em;
}
.rate-buttons { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.btn-rate {
 padding: 8px 12px; border-radius: 999px; border: 1px solid transparent;
 font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer;
 transition: transform .12s, opacity .12s; text-transform: uppercase; letter-spacing: .02em;
}


.btn-rate:active { transform: scale(.92); }
.btn-rate:hover { opacity: .88; }
/* male tiers */
.btn-rate.sub3 { background: #fff; color: var(--dim); border-color: var(--line); }
.btn-rate.sub5 { background: #ededea; color: #57575d; }
.btn-rate.ltn { background: #d6d6d1; color: #141416; }
.btn-rate.mtn { background: #a8a8ae; color: #fff; }
.btn-rate.htn { background: #75757c; color: #fff; }
.btn-rate.chadlite { background: #3d3d42; color: #fff; }
.btn-rate.chad { background: #141416; color: #fff; }
/* female tiers */
.btn-rate.sub3f { background: #fff; color: var(--dim); border-color: var(--line); }
.btn-rate.sub5f { background: #ededea; color: #57575d; }
.btn-rate.ltb { background: #d6d6d1; color: #141416; }
.btn-rate.mtb { background: #a8a8ae; color: #fff; }
.btn-rate.htb { background: #75757c; color: #fff; }
.btn-rate.stacylite { background: #3d3d42; color: #fff; }
.btn-rate.stacy { background: #141416; color: #fff; }
.btn-rate.trueeve { background: #000; color: #fff; }

.toast {
 position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
 background: #141416; color: #fff; padding: 15px 26px; border-radius: 999px;
 font-size: 14.5px; font-weight: 600; z-index: 200;
 animation: fadeInOut 1.8s ease; pointer-events: none;
 box-shadow: 0 12px 40px rgba(20,20,22,.25);
}
@keyframes fadeInOut { 0% { opacity:0; transform:translate(-50%,-50%) scale(0.9); } 12% { opacity:1; transform:translate(-50%,-50%) scale(1); } 80% { opacity:1; } 100% { opacity:0; } }
.empty-state {
 display: flex; flex-direction: column; align-items: center; justify-content: center;
 flex: 1; padding: 40px; text-align: center; gap: 10px;
}
.empty-state h3 { font-size: 20px; color: #141416; font-weight: 800; letter-spacing: -.02em; }
.empty-state p { font-size: 14px; color: var(--dim); }
.setting-row {
 display: flex; justify-content: space-between; align-items: center; gap: 12px;
 padding: 14px 18px; background: #fff; margin: 0 16px 8px;
 border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.04);
}
.setting-row > span { font-size: 14px; font-weight: 600; }
.setting-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.setting-btn {
 padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
 background: #fff; color: #141416; font-family: inherit;
 font-size: 12.5px; font-weight: 600; cursor: pointer; transition: .15s;
}
.setting-btn:hover { border-color: #c4c4bd; }
.setting-btn.selected { background: #141416; color: #fff; border-color: #141416; }

/* экран входа — показывается, когда приложение открыто не из Telegram */
body.need-auth .nav { display: none; }
.auth-box { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 40px 28px; margin: auto; }
.auth-icon {
 width: 62px; height: 62px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
 display: flex; align-items: center; justify-content: center; color: #141416; margin-bottom: 6px;
 box-shadow: 0 4px 16px rgba(20,20,22,.07);
}
.auth-title { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.auth-text { font-size: 14px; color: var(--dim); line-height: 1.5; max-width: 290px; }
.auth-btn {
 margin-top: 16px; display: inline-flex; align-items: center; gap: 9px;
 border: 1px solid #141416; background: #141416; color: #fff; text-decoration: none;
 font-family: inherit; font-size: 14px; font-weight: 700;
 padding: 13px 26px; border-radius: 999px; cursor: pointer;
}
.auth-btn:hover { opacity: .88; }
.auth-btn svg { width: 18px; height: 18px; }
.auth-alt {
 margin-top: 4px; border: none; background: none; color: var(--dim); text-decoration: none;
 font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 8px;
}
.auth-alt:hover { color: #141416; }

/* recent ratings list */
/* просмотр фото на весь экран */
.lightbox {
 position: fixed; inset: 0; z-index: 300; display: none;
 align-items: center; justify-content: center; padding: 16px;
 background: rgba(20,20,22,.94); opacity: 0; transition: opacity .22s ease;
}
.lightbox.open { display: flex; opacity: 1; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 14px; object-fit: contain; }
.lightbox-close {
 position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px;
 width: 40px; height: 40px; padding: 0; border-radius: 999px;
 border: 1px solid rgba(20,20,22,.07); background: #fff; color: #141416;
 display: flex; align-items: center; justify-content: center; cursor: pointer;
 box-shadow: 0 4px 16px rgba(0,0,0,.3);
}
.profile-photo img { cursor: zoom-in; }

/* раскрывающиеся секции */
.acc { margin: 0 16px 10px; }
.acc-btn {
 width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
 padding: 14px 18px; border-radius: 999px; border: 1px solid var(--line);
 background: #fff; color: #141416; font-family: inherit;
 font-size: 14px; font-weight: 700; cursor: pointer; transition: .15s;
}
.acc-btn:hover { border-color: #c4c4bd; }
.acc-btn .chev { transition: transform .3s ease; flex-shrink: 0; }
.acc-btn.open .chev { transform: rotate(180deg); }
.acc-btn.blue { background: #5b9bd5; border-color: #5b9bd5; color: #fff; }
.acc-btn.pink { background: #ff6b9d; border-color: #ff6b9d; color: #fff; }
.acc-btn.blue:hover, .acc-btn.pink:hover { opacity: .9; }
.acc-body { max-height: 0; overflow: hidden; opacity: 0; transition: max-height .35s ease, opacity .25s ease; }
.acc-body.open { opacity: 1; }
.acc-inner { padding: 6px 2px 2px; }

/* строка топа */
.top-item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.top-item:last-child { border-bottom: none; }
.top-rank { width: 22px; flex-shrink: 0; font-size: 13px; font-weight: 800; color: var(--dim); text-align: center; }
.top-avatar { width: 42px; height: 42px; border-radius: 999px; background: var(--soft); flex-shrink: 0; overflow: hidden; }
.top-avatar img { width: 100%; height: 100%; object-fit: cover; }
.top-info { flex: 1; min-width: 0; }
.top-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-sub { font-size: 11px; color: var(--dim); }
.top-score { font-size: 13px; font-weight: 800; flex-shrink: 0; }

/* редактирование анкеты */
.edit-photos { display: flex; gap: 10px; }
.edit-photo { flex: 1 1 0; min-width: 0; }
.edit-photo-frame {
 width: 100%; aspect-ratio: 1/1; border-radius: 16px; overflow: hidden;
 background: var(--soft); border: 1px solid var(--line);
 display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 12px;
}
.edit-photo-frame img { width: 100%; height: 100%; object-fit: cover; }
.edit-photo-btn {
 width: 100%; margin-top: 7px; padding: 8px 10px; border-radius: 999px;
 border: 1px solid var(--line); background: #fff; color: #141416;
 font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
}
.edit-photo-btn:hover { border-color: #c4c4bd; }
.edit-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.edit-row label { font-size: 13px; font-weight: 600; flex-shrink: 0; }
.edit-age {
 flex: 1; min-width: 0; padding: 11px 16px; border-radius: 999px;
 border: 1px solid var(--line); background: #fff; color: #141416;
 font-family: inherit; font-size: 14px; font-weight: 600; outline: none;
}
.edit-age:focus { border-color: #141416; }
.edit-save {
 width: 100%; margin-top: 12px; padding: 13px; border-radius: 999px;
 border: 1px solid #141416; background: #141416; color: #fff;
 font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
}
.edit-save:hover { opacity: .88; }
.edit-save[disabled] { opacity: .5; cursor: default; }
.edit-danger {
 width: 100%; margin-top: 10px; padding: 12px; border-radius: 999px;
 border: 1px solid var(--line); background: #fff; color: #c2453c;
 font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
}
.edit-danger:hover { border-color: #c2453c; }
.edit-confirm { display: flex; gap: 8px; margin-top: 10px; }
.edit-confirm button { flex: 1 1 0; padding: 12px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.edit-confirm .yes { border: 1px solid #c2453c; background: #c2453c; color: #fff; }
.edit-confirm .no { border: 1px solid var(--line); background: #fff; color: #141416; }

.rates-list { padding: 0 16px; }
.rate-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rate-item:last-child { border-bottom: none; }
.rate-item-avatar { width: 40px; height: 40px; border-radius: 999px; background: var(--soft); flex-shrink: 0; overflow: hidden; }
.rate-item-avatar img { width: 100%; height: 100%; object-fit: cover; }
.rate-item-info { flex: 1; min-width: 0; }
.rate-item-name { font-size: 14px; font-weight: 600; }
.rate-item-date { font-size: 11px; color: var(--dim); }
.rate-item-tier { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; flex-shrink: 0; }
.rate-item-tier.sub3 { background: var(--soft); color: var(--dim); }
.rate-item-tier.sub5 { background: #ededea; color: #57575d; }
.rate-item-tier.ltn { background: #d6d6d1; color: #141416; }
.rate-item-tier.mtn { background: #a8a8ae; color: #fff; }
.rate-item-tier.htn { background: #75757c; color: #fff; }
.rate-item-tier.chadlite { background: #3d3d42; color: #fff; }
.rate-item-tier.chad { background: #141416; color: #fff; }
.rate-item-tier.sub3f { background: var(--soft); color: var(--dim); }
.rate-item-tier.sub5f { background: #ededea; color: #57575d; }
.rate-item-tier.ltb { background: #d6d6d1; color: #141416; }
.rate-item-tier.mtb { background: #a8a8ae; color: #fff; }
.rate-item-tier.htb { background: #75757c; color: #fff; }
.rate-item-tier.stacylite { background: #3d3d42; color: #fff; }
.rate-item-tier.stacy { background: #141416; color: #fff; }
.rate-item-tier.trueeve { background: #000; color: #fff; }

@media (max-height: 700px) {
 .profile-photo { max-height: 40vh; }
 .profile-info { padding: 8px 18px 4px; }
 .profile-info h2 { font-size: 19px; }
 .profile-card { margin: 10px 16px; }
}
/* совсем низкие экраны: иначе нижний ряд оценок уезжает под меню */
@media (max-height: 620px) {
 .profile-photo { max-height: 36vh; }
}
@media (max-width: 460px) {
 .setting-row { flex-direction: column; align-items: stretch; gap: 11px; }
 .setting-btns { justify-content: space-between; flex-wrap: nowrap; }
 .setting-btn { flex: 1 1 0; min-width: 0; text-align: center; }
}
</style>
</head>
<body>
<div id="screenLoading" class="screen active">
<div class="empty-state"><h3>ДайМогнуть!</h3><p>Загрузка...</p></div>
</div>
<div id="screenAuth" class="screen">
  <div class="auth-box">
    <div class="auth-icon">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10.5" width="16" height="10.5" rx="3"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4"/>
      </svg>
    </div>
    <div class="auth-title">Нужен вход через Telegram</div>
    <div class="auth-text" id="authText">Анкеты доступны только участникам бота. Откройте приложение через Telegram, тогда вход произойдёт автоматически.</div>
    <a class="auth-btn" id="authBtn" href="#">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.9 19c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.7 8.6-7.8c.4-.3-.1-.5-.6-.2L6.9 13.1 2.4 11.7c-1-.3-1-1 .2-1.4l18-6.9c.8-.3 1.5.2 1.3 1z"/></svg>
      Войти через Telegram
    </a>
    <a class="auth-alt" href="/tools/">Вернуться на сайт</a>
  </div>
</div>
<div id="screenMain" class="screen">
 <div class="header">
 <button class="back-btn" onclick="goSite()" aria-label="Назад в инструменты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
 <div class="header-title">Дай<span class="dim">Могнуть!</span></div>
 </div>
 <div id="mainContent"><div class="empty-state"><h3>Никого нет</h3><p>Пока нет анкет для оценки</p></div></div>
</div>
<div id="screenStats" class="screen">
 <div class="header">
 <button class="back-btn" onclick="goSite()" aria-label="Назад в инструменты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
 <div class="header-title">Моя <span class="dim">статистика</span></div>
 </div>
 <div id="statsContent"><div class="empty-state"><h3>Загрузка...</h3></div></div>
</div>
<div id="screenSettings" class="screen">
 <div class="header">
 <button class="back-btn" onclick="goSite()" aria-label="Назад в инструменты"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
 <div class="header-title">Настройки</div>
 </div>
 <div id="settingsContent"></div>
</div>
<nav class="nav" id="navbar">
<button class="nav-btn active" onclick="showScreen('screenMain')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3.5" width="13" height="15" rx="3" transform="rotate(6 13.5 11)"/><rect x="4" y="5.5" width="13" height="15" rx="3" transform="rotate(-6 10.5 13)"/><path d="m8.2 12.4 1.6 1.7 3.4-3.6"/></svg>Оценка</button>
<button class="nav-btn" onclick="showScreen('screenStats')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16.5 9 10.5l3.5 3.5L20.5 5.5"/><polyline points="15.5 5.5 20.5 5.5 20.5 10.5"/><path d="M3.5 20.5h17"/></svg>Статистика</button>
<button class="nav-btn" onclick="showScreen('screenSettings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="14.5" cy="8" r="2.6"/><circle cx="8.5" cy="16" r="2.6"/></svg>Настройки</button>
</nav>
<div class="lightbox" id="lightbox" onclick="closePhoto()">
  <button class="lightbox-close" onclick="closePhoto()" aria-label="Закрыть">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </button>
  <img id="lightboxImg" alt="">
</div>
<input type="file" id="photoInput" accept="image/*" style="display:none">
<div id="toastContainer"></div>
<script>
const API = '/wa/api';
const BOT = 'mogmatch_bot';          // ссылка для входа: t.me/<BOT>
let initData = '';                    // подпись Telegram, уходит в каждый запрос
let user = {};
let userProfile = null;
let currentCandidate = null;
let currentPhotoIdx = 0;
let photoTimer = null;
let touchStartX = 0;
let suppressClick = false;   // чтобы свайп по фото не открывал его на весь экран

const MALE_TIERS = [
  { key: 'sub3', label: 'Sub3', cls: 'sub3' },
  { key: 'sub5', label: 'Sub5', cls: 'sub5' },
  { key: 'ltn', label: 'LTN', cls: 'ltn' },
  { key: 'mtn', label: 'MTN', cls: 'mtn' },
  { key: 'htn', label: 'HTN', cls: 'htn' },
  { key: 'chadlite', label: 'CL', cls: 'chadlite' },
  { key: 'chad', label: 'Chad', cls: 'chad' }
];

const FEMALE_TIERS = [
  { key: 'sub3', label: 'Sub3', cls: 'sub3f' },
  { key: 'sub5', label: 'Sub5', cls: 'sub5f' },
  { key: 'ltb', label: 'LTB', cls: 'ltb' },
  { key: 'mtb', label: 'MTB', cls: 'mtb' },
  { key: 'htb', label: 'HTB', cls: 'htb' },
  { key: 'stacylite', label: 'SL', cls: 'stacylite' },
  { key: 'stacy', label: 'Stacy', cls: 'stacy' },
  { key: 'trueeve', label: 'TrueEve', cls: 'trueeve' }
];

function init() {
 const tg = window.Telegram?.WebApp;
 if (tg) { tg.expand(); tg.ready(); document.body.classList.add('in-tg'); }

 // личность берём только из подписанных данных Telegram: без них входа нет
 initData = tg?.initData || '';
 const tgUser = tg?.initDataUnsafe?.user;
 if (!initData || !tgUser?.id) { showAuth(); return; }
 user = tgUser;

 loadProfile().then(() => {
 showScreen('screenMain');
 loadCandidate();
 });
}

function showAuth(msg) {
 document.body.classList.add('need-auth');
 const btn = document.getElementById('authBtn');
 // из браузера — в бота; внутри Telegram (истёкшая подпись) — просто перезапуск
 if (btn) btn.href = 'https://t.me/' + BOT + '?startapp';
 if (msg) { const t = document.getElementById('authText'); if (t) t.textContent = msg; }
 document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
 document.getElementById('screenAuth').classList.add('active');
}

function startPhotoSlideshow() {
 stopPhotoSlideshow();
 const photos = Array.isArray(currentCandidate.photos) ? currentCandidate.photos.filter(Boolean) : [];
 if (photos.length <= 1) return;
 photoTimer = setInterval(() => {
 const dots = document.querySelectorAll('#ppDots .photo-dot');
 if (dots.length <= 1) return;
 const next = (currentPhotoIdx + 1) % dots.length;
 navigatePhotoTo(next);
 }, 3000);
}

function stopPhotoSlideshow() {
 if (photoTimer) { clearInterval(photoTimer); photoTimer = null; }
}

function handleTouchStart(e) {
 touchStartX = e.changedTouches[0].screenX;
}

function handleTouchEnd(e) {
 const dx = e.changedTouches[0].screenX - touchStartX;
 const photos = Array.isArray(currentCandidate.photos) ? currentCandidate.photos.filter(Boolean) : [];
 if (Math.abs(dx) > 50 && photos.length > 1) {
 suppressClick = true;                 // свайп не должен открывать фото
 setTimeout(() => { suppressClick = false; }, 400);
 stopPhotoSlideshow();
 if (dx < 0) navigatePhoto(1);
 else navigatePhoto(-1);
 startPhotoSlideshow();
 }
}

// ─── фото на весь экран ───────────────────────────────────────────
function openPhoto(src) {
 if (suppressClick || !src) return;
 const box = document.getElementById('lightbox');
 document.getElementById('lightboxImg').src = src;
 box.classList.add('open');
}

function closePhoto() {
 document.getElementById('lightbox').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePhoto(); });

// ─── раскрывающиеся секции ────────────────────────────────────────
function toggleAcc(btn, bodyId, loader) {
 const body = document.getElementById(bodyId);
 if (!body) return;
 const open = btn.classList.toggle('open');
 body.classList.toggle('open', open);
 if (open) {
 body.style.maxHeight = body.scrollHeight + 'px';
 if (loader && !body.dataset.loaded) {
 body.dataset.loaded = '1';
 Promise.resolve(loader()).then(() => resizeAcc(bodyId));
 }
 } else {
 body.style.maxHeight = '0px';
 }
}

// содержимое приходит уже после раскрытия — подгоняем высоту
function resizeAcc(bodyId) {
 const body = document.getElementById(bodyId);
 if (body && body.classList.contains('open')) body.style.maxHeight = body.scrollHeight + 'px';
}

function goSite() { location.href = '/tools/'; }

function showToast(msg) {
 const c = document.getElementById('toastContainer');
 const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
 c.appendChild(t); setTimeout(() => t.remove(), 1800);
}

function showScreen(id) {
 document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
 const idx = { screenMain: 0, screenStats: 1, screenSettings: 2 }[id];
 if (idx !== undefined) document.querySelectorAll('.nav-btn')[idx]?.classList.add('active');
 if (id === 'screenStats') loadStats();
 if (id === 'screenSettings') loadSettings();
}

async function apiPost(path, body) {
 try {
 const r = await fetch(API + path, {
 method: 'POST',
 headers: {
 'Content-Type': 'application/json',
 'Authorization': 'tma ' + initData   // сервер сам достаёт user_id из подписи
 },
 body: JSON.stringify(body || {})
 });
 if (r.status === 401) {
 showAuth('Сессия недействительна. Откройте приложение через Telegram заново.');
 return { _error: true, _auth: true };
 }
 if (!r.ok) return { _error: true };
 return await r.json();
 } catch (_) {
 return { _error: true };
 }
}

async function loadProfile() {
 const d = await apiPost('/profile');
 if (d.profile) userProfile = d.profile;
}

async function loadCandidate() {
 const c = document.getElementById('mainContent');
 c.innerHTML = '<div class="empty-state"><h3>Поиск...</h3></div>';
 const d = await apiPost('/candidate');
 if (d._error) {
 c.innerHTML = '<div class="empty-state"><h3>Нет связи</h3><p>Не удалось загрузить анкеты</p></div>';
 return;
 }
 if (d.profiles && d.profiles.length) {
 currentCandidate = d.profiles[0];
 currentPhotoIdx = 0;
 renderCandidateCard(currentCandidate);
 } else {
 c.innerHTML = '<div class="empty-state"><h3>Все оценены</h3><p>Загляни позже</p></div>';
 }
}

function renderCandidateCard(p) {
 const c = document.getElementById('mainContent');
 const photos = Array.isArray(p.photos) ? p.photos.filter(Boolean) : [];
 const isMale = p.gender === 'male';
 const tiers = isMale ? MALE_TIERS : FEMALE_TIERS;

 c.innerHTML = `
 <div class="profile-card">
 <div class="profile-photo" id="ppContainer" ontouchstart="handleTouchStart(event)" ontouchend="handleTouchEnd(event)">
 ${photos.length ? `<img id="ppImg" src="${API}/photo/${photos[0]}" alt="photo" onclick="openPhoto(this.src)">` : '<span>Нет фото</span>'}
 </div>
 ${photos.length > 1 ? `<div class="photo-dots" id="ppDots">${photos.map((_, i) => `<div class="photo-dot${i === 0 ? ' active' : ''}"></div>`).join('')}</div>` : ''}
 <div class="profile-info">
 <h2>${escapeHtml(p.display_name || '')}, ${p.age || '?'}</h2>
 ${p.username ? `<div class="username">@${escapeHtml(p.username)}</div>` : ''}
 <div class="stats">
 <span style="color:${isMale ? '#5b9bd5' : '#ff6b9d'};font-weight:600">${isMale ? 'Парень' : 'Девушка'}</span>
 </div>
 </div>
 <div class="rate-section">
 <div class="rate-title">Оценить</div>
 <div class="rate-buttons">
 ${tiers.map(t => `<button class="btn-rate ${t.cls}" onclick="rate('${t.key}')">${t.label}</button>`).join('')}
 </div>
 </div>
 </div>`;
}

function navigatePhotoTo(idx) {
 currentPhotoIdx = idx;
 const photos = Array.isArray(currentCandidate.photos) ? currentCandidate.photos.filter(Boolean) : [];
 const img = document.getElementById('ppImg');
 if (img && photos[idx]) img.src = API + '/photo/' + photos[idx];
 const dots = document.querySelectorAll('#ppDots .photo-dot');
 dots.forEach((d, i) => d.classList.toggle('active', i === idx));
}

function navigatePhoto(dir) {
 const photos = Array.isArray(currentCandidate.photos) ? currentCandidate.photos.filter(Boolean) : [];
 currentPhotoIdx = Math.max(0, Math.min(photos.length - 1, currentPhotoIdx + dir));
 const img = document.getElementById('ppImg');
 if (img) img.src = API + '/photo/' + photos[currentPhotoIdx];
 const dots = document.querySelectorAll('#ppDots .photo-dot');
 dots.forEach((d, i) => d.classList.toggle('active', i === currentPhotoIdx));
}

async function rate(tier) {
 if (!currentCandidate) return;
 stopPhotoSlideshow();
 const d = await apiPost('/rate', {
 rated_id: currentCandidate.user_id,
 tier: tier
 });
 if (d.ok) {
 showToast(tier.charAt(0).toUpperCase() + tier.slice(1));
 loadCandidate();
 } else {
 showToast('Ошибка');
 }
}

async function loadStats() {
 const c = document.getElementById('statsContent');
 const d = await apiPost('/profile');
 if (d.profile) {
 const p = d.profile;
 c.innerHTML = `
 <div class="profile-card" style="margin:12px 16px">
 <div class="profile-info">
 <h2>${escapeHtml(p.display_name || '')}${p.age ? ', ' + p.age : ''}</h2>
 ${p.username ? `<div class="username">@${escapeHtml(p.username)}</div>` : ''}
 <div class="stats" style="flex-wrap:wrap;gap:20px;margin-top:10px">
 <span>Оценено: <strong>${p.ratings_count || 0}</strong></span>
 ${p.tier ? `<span>Тир: <strong>${(p.tier || '').toUpperCase()}</strong></span>` : ''}
 ${p.vip_until ? `<span>VIP: <strong>${new Date(p.vip_until).toLocaleDateString('ru-RU')}</strong></span>` : ''}
 </div>
 </div>
 </div>
 <div class="setting-row">
 <span>Кого оценивать</span>
 <div class="setting-btns">
 <button class="setting-btn${p.rating_preference === 'male' ? ' selected' : ''}" onclick="setPref('male')">Парней</button>
 <button class="setting-btn${p.rating_preference === 'female' ? ' selected' : ''}" onclick="setPref('female')">Девушек</button>
 <button class="setting-btn${!p.rating_preference || p.rating_preference === 'any' ? ' selected' : ''}" onclick="setPref('any')">Всех</button>
 </div>
 </div>
 <div style="margin-top:14px">
 <div class="acc">
 <button class="acc-btn" onclick="toggleAcc(this,'accRecent',loadRecentRates)">
 Последние оценки
 <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
 </button>
 <div class="acc-body" id="accRecent"><div class="acc-inner"><div id="recentRates" class="rates-list"><div class="empty-state" style="padding:16px"><p>Загрузка...</p></div></div></div></div>
 </div>
 <div class="acc">
 <button class="acc-btn blue" onclick="toggleAcc(this,'accTopMale',() => loadTop('male'))">
 Топ парней
 <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
 </button>
 <div class="acc-body" id="accTopMale"><div class="acc-inner"><div id="topMale"><div class="empty-state" style="padding:16px"><p>Загрузка...</p></div></div></div></div>
 </div>
 <div class="acc">
 <button class="acc-btn pink" onclick="toggleAcc(this,'accTopFemale',() => loadTop('female'))">
 Топ девушек
 <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
 </button>
 <div class="acc-body" id="accTopFemale"><div class="acc-inner"><div id="topFemale"><div class="empty-state" style="padding:16px"><p>Загрузка...</p></div></div></div></div>
 </div>
 </div>`;
 } else if (d._error) {
 c.innerHTML = '<div class="empty-state"><h3>Нет связи</h3><p>Не удалось загрузить статистику</p></div>';
 } else {
 c.innerHTML = '<div class="empty-state"><h3>Нет профиля</h3></div>';
 }
}

async function loadRecentRates() {
 const d = await apiPost('/my-rates');
 const el = document.getElementById('recentRates');
 if (!el) return;
 if (d._error || !d.rates || !d.rates.length) {
 el.innerHTML = '<div class="empty-state" style="padding:20px"><p>Пока нет оценок</p></div>';
 return;
 }
 renderRates(el, d.rates);
}

function renderRates(el, rates) {
 el.innerHTML = rates.map(r => {
 const date = new Date(r.created_at).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
 const avatar = r.photo_front ? API + '/photo/' + r.photo_front : '';
 return `
 <div class="rate-item">
 <div class="rate-item-avatar">${avatar ? `<img src="${avatar}" alt="">` : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:16px">👤</div>'}</div>
 <div class="rate-item-info">
 <div class="rate-item-name">${escapeHtml(r.display_name || r.username || 'Аноним')}</div>
 <div class="rate-item-date">${date}</div>
 </div>
 <div class="rate-item-tier ${r.tier}">${r.tier}</div>
 </div>`;
 }).join('');
}

// ─── топ по оценкам ───────────────────────────────────────────────
async function loadTop(gender) {
 const el = document.getElementById(gender === 'male' ? 'topMale' : 'topFemale');
 if (!el) return;
 const d = await apiPost('/top', { gender });
 if (d._error || !d.top) {
 el.innerHTML = '<div class="empty-state" style="padding:16px"><p>Не удалось загрузить топ</p></div>';
 return;
 }
 if (!d.top.length) {
 el.innerHTML = '<div class="empty-state" style="padding:16px"><p>Пока никого нет в топе</p></div>';
 return;
 }
 el.innerHTML = d.top.map((p, i) => {
 const avatar = p.photo_front ? API + '/photo/' + p.photo_front : '';
 const tier = p.tier || '';
 return `
 <div class="top-item">
 <div class="top-rank">${i + 1}</div>
 <div class="top-avatar">${avatar ? `<img src="${avatar}" alt="" onclick="openPhoto(this.src)">` : ''}</div>
 <div class="top-info">
 <div class="top-name">${escapeHtml(p.display_name || p.username || 'Аноним')}${p.age ? ', ' + p.age : ''}</div>
 <div class="top-sub">${p.ratings_count} оцен.</div>
 </div>
 <div class="rate-item-tier ${tier}">${tier}</div>
 </div>`;
 }).join('');
}

function loadSettings() {
 const s = document.getElementById('settingsContent');
 s.innerHTML = `
 <div style="padding:12px 0;display:flex;flex-direction:column;gap:12px">
 <div class="setting-row">
 <span>Кого оценивать</span>
 <div class="setting-btns">
 <button id="prefMale" class="setting-btn${userProfile?.rating_preference === 'male' ? ' selected' : ''}" onclick="setPref('male')">Парней</button>
 <button id="prefFemale" class="setting-btn${userProfile?.rating_preference === 'female' ? ' selected' : ''}" onclick="setPref('female')">Девушек</button>
 <button id="prefAny" class="setting-btn${!userProfile?.rating_preference || userProfile?.rating_preference === 'any' ? ' selected' : ''}" onclick="setPref('any')">Всех</button>
 </div>
 </div>
 <div class="acc">
 <button class="acc-btn" onclick="toggleAcc(this,'accEdit',renderEditForm)">
 Редактировать анкету
 <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
 </button>
 <div class="acc-body" id="accEdit"><div class="acc-inner" id="editForm"></div></div>
 </div>
 </div>`;
}

// ─── редактирование анкеты ────────────────────────────────────────
function photoSlotHtml(slot, title) {
 const fid = slot === 'front' ? userProfile?.photo_front : userProfile?.photo_side;
 const src = fid ? API + '/photo/' + fid : '';
 return `
 <div class="edit-photo">
 <div class="edit-photo-frame" id="prev-${slot}">
 ${src ? `<img src="${src}" alt="" onclick="openPhoto(this.src)">` : 'Нет фото'}
 </div>
 <button class="edit-photo-btn" onclick="pickPhoto('${slot}')">${title}</button>
 </div>`;
}

function renderEditForm() {
 const el = document.getElementById('editForm');
 if (!el) return;
 el.innerHTML = `
 <div class="edit-photos">
 ${photoSlotHtml('front', 'Фото 1')}
 ${photoSlotHtml('side', 'Фото 2')}
 </div>
 <div class="edit-row">
 <label for="editAge">Возраст</label>
 <input class="edit-age" id="editAge" type="number" inputmode="numeric" min="14" max="99" value="${userProfile?.age || ''}">
 </div>
 <button class="edit-save" id="editSave" onclick="saveProfile()">Сохранить</button>
 <div id="deleteZone">
 <button class="edit-danger" onclick="askDelete()">Удалить анкету</button>
 </div>`;
}

let photoSlot = null;

function pickPhoto(slot) {
 photoSlot = slot;
 const inp = document.getElementById('photoInput');
 inp.value = '';
 inp.click();
}

// ужимаем на клиенте: телефонные снимки по 5-10 МБ незачем гнать целиком
function readAndResize(file, maxDim) {
 return new Promise((resolve, reject) => {
 const url = URL.createObjectURL(file);
 const im = new Image();
 im.onload = () => {
 const k = Math.min(1, maxDim / Math.max(im.width, im.height));
 const c = document.createElement('canvas');
 c.width = Math.max(1, Math.round(im.width * k));
 c.height = Math.max(1, Math.round(im.height * k));
 c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
 URL.revokeObjectURL(url);
 resolve(c.toDataURL('image/jpeg', 0.85));
 };
 im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
 im.src = url;
 });
}

async function onPhotoPicked(e) {
 const file = e.target.files && e.target.files[0];
 if (!file || !photoSlot) return;
 const slot = photoSlot;
 showToast('Загружаем...');
 let dataUrl;
 try {
 dataUrl = await readAndResize(file, 1280);
 } catch (_) {
 showToast('Не удалось открыть файл');
 return;
 }
 const d = await apiPost('/update-photo', { slot, image: dataUrl });
 if (!d.ok || !d.file_id) {
 if (!d._auth) showToast('Ошибка загрузки');
 return;
 }
 if (slot === 'front') userProfile.photo_front = d.file_id;
 else userProfile.photo_side = d.file_id;
 const frame = document.getElementById('prev-' + slot);
 if (frame) frame.innerHTML = `<img src="${dataUrl}" alt="" onclick="openPhoto(this.src)">`;
 showToast('Фото обновлено');
}

async function saveProfile() {
 const input = document.getElementById('editAge');
 const btn = document.getElementById('editSave');
 const age = parseInt(input.value, 10);
 if (!age || age < 14 || age > 99) { showToast('Возраст от 14 до 99'); return; }
 btn.disabled = true;
 const d = await apiPost('/update-profile', { age });
 btn.disabled = false;
 if (d.ok) {
 userProfile.age = age;
 showToast('Сохранено');
 } else if (!d._auth) {
 showToast('Не удалось сохранить');
 }
}

function askDelete() {
 const zone = document.getElementById('deleteZone');
 if (!zone) return;
 zone.innerHTML = `
 <div class="edit-confirm">
 <button class="yes" onclick="confirmDelete()">Точно удалить</button>
 <button class="no" onclick="cancelDelete()">Отмена</button>
 </div>`;
 resizeAcc('accEdit');
}

function cancelDelete() {
 const zone = document.getElementById('deleteZone');
 if (zone) zone.innerHTML = '<button class="edit-danger" onclick="askDelete()">Удалить анкету</button>';
 resizeAcc('accEdit');
}

async function confirmDelete() {
 const d = await apiPost('/delete-profile');
 if (!d.ok) {
 if (!d._auth) showToast('Не удалось удалить');
 return;
 }
 showToast('Анкета удалена');
 setTimeout(() => {
 const tg = window.Telegram?.WebApp;
 if (tg?.close) tg.close();
 else location.href = '/tools/';
 }, 1200);
}

async function setPref(val) {
 if (!userProfile) return;
 userProfile.rating_preference = val;
 document.querySelectorAll('#screenSettings .setting-btn, #statsContent .setting-btn').forEach(b => b.classList.remove('selected'));
 const id = 'pref' + val.charAt(0).toUpperCase() + val.slice(1);
 document.querySelectorAll('#' + id).forEach(el => {
 if (el) el.classList.add('selected');
 });
 await apiPost('/set-pref', { pref: val });
 showToast('Сохранено');
}

function escapeHtml(t) {
 const d = document.createElement('div');
 d.textContent = t;
 return d.innerHTML;
}

document.getElementById('photoInput').addEventListener('change', onPhotoPicked);

init();
</script>
